version: "1.0"
profile:
  name: qodana.starter
projectJDK: "21"
linter: jetbrains/qodana-jvm-community:2025.2
# Historical source is preserved for possible data export, never imported into the current app.
exclude:
  - name: All
    paths:
      - backend/
      - .pi/
      - .mockups/
      - content-source/drafts/
      - build/
      - site/build/
      - shared/build/
