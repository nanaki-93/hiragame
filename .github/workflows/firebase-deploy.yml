name: Deploy to Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'shared/**'
      - 'tools/**'
      - 'content-source/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/firebase-deploy.yml'
      - '.github/workflows/content-check.yml'
      - 'firebase.json'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test content tooling and workflow gates
        run: python3 -m unittest discover -s tools -p 'test_*content*.py'

      - name: Validate reviewed canonical content
        run: python3 tools/validate_content.py site/src/jsMain/resources/public/content --review-root content-source/review-notes

      - name: Test shared content on Node
        run: ./gradlew :shared:jsNodeTest

      - name: Build project
        run: ./gradlew site:build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_TOKEN }}'
          channelId: live
          projectId: hiragame