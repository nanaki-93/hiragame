name: Deploy to Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'shared/**'
      - 'tools/**'
      - 'content-source/**'
      - 'backend/migration/question.csv'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/firebase-deploy.yml'
      - '.github/workflows/content-check.yml'
      - 'firebase.json'
      - '.mockups/design-system/tokens.css'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify preserved CSV bytes
        run: cmp backend/migration/question.csv content-source/legacy/question.csv

      - name: Verify deterministic legacy drafts
        run: python3 tools/convert_legacy_content.py --input content-source/legacy/question.csv --topic-map content-source/topic-map.json --output content-source/drafts/legacy

      - name: Test all Python tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Validate reviewed canonical content
        run: python3 tools/validate_content.py site/src/jsMain/resources/public/content --review-root content-source/review-notes

      - name: Validate selected mock artifacts
        run: python3 tools/validate_mockups.py .mockups --stage complete

      - name: Test Kotlin and offline policy on Node
        run: ./gradlew :shared:jsNodeTest :site:jsNodeTest :site:offlinePolicyTest

      - name: Assemble production hosting tree
        run: ./gradlew :site:reorganizeOutput

      - name: Validate local runtime artifact
        run: python3 tools/validate_local_runtime.py --artifact-root site/build/dist/js/productionExecutable/public

      - name: Validate offline release
        run: python3 tools/validate_release.py site/build/dist/js/productionExecutable/public

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_TOKEN }}'
          channelId: live
          projectId: hiragame
