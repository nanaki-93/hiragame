name: Check canonical content

on: [push, pull_request]

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content and tooling
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify preserved CSV bytes
        run: cmp backend/migration/question.csv content-source/legacy/question.csv

      # The converter refuses to overwrite changed drafts; an identical rerun is read-only.
      - name: Verify deterministic legacy drafts
        run: python3 tools/convert_legacy_content.py --input content-source/legacy/question.csv --topic-map content-source/topic-map.json --output content-source/drafts/legacy

      - name: Test content tooling and workflow gates
        run: python3 -m unittest discover -s tools -p 'test_*content*.py'

      - name: Validate reviewed canonical content
        run: python3 tools/validate_content.py site/src/jsMain/resources/public/content --review-root content-source/review-notes

      - name: Test local runtime tooling
        run: python3 -m unittest discover -s tools -p 'test_*runtime*.py'

      # Kotlin/Gradle manages Node for both modules; no browser or backend is needed.
      - name: Test shared and site on Node
        run: ./gradlew :shared:jsNodeTest :site:jsNodeTest

      - name: Assemble production hosting tree
        run: ./gradlew :site:reorganizeOutput

      - name: Validate local runtime artifact
        run: python3 tools/validate_local_runtime.py --artifact-root site/build/dist/js/productionExecutable/public
